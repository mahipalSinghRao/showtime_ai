name: ShowTime Backend CI

on:
  push:
    branches:
      - main1
      - develop

  pull_request:
    branches:
      - main1
      - develop

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Type Check
        run: npm run type-check

      - name: Build Project
        run: npm run build

      - name: Run Tests
        run: npm test