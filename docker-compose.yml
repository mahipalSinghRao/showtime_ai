services:

  mongodb:
    image: mongo:8
    container_name: showtime-mongodb
    restart: unless-stopped

    ports:
      - "27017:27017"

    volumes:
      - mongodb_data:/data/db

    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: showtime-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .

    container_name: showtime-backend

    restart: unless-stopped

    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

    ports:
      - "5000:5000"

    env_file:
      - .env.docker

volumes:
  mongodb_data:
  redis_data: